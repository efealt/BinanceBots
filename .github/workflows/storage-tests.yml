name: Core trading tests

on:
  push:
    branches: [main]
    paths:
      - "src/storage/**"
      - "src/backtest.rs"
      - "src/backtest/**"
      - "src/trading/**"
      - "src/api/**"
      - "web/backtests.html"
      - "web/backtests.js"
      - "web/styles.css"
      - "migrations/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "test-data/**"
      - ".github/workflows/storage-tests.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Check backtest JavaScript syntax
        run: node --check web/backtests.js
      - name: Run Rust tests
        run: cargo test --all-targets
      - name: Run full frozen XAGUSDT grid regression
        run: |
          fixture="test-data/xagusdt_1m_2026.sqlite3"
          before="$(sha256sum "$fixture" | awk '{print $1}')"
          test "$before" = "37afda792f5f06cee9e63eca010f6c5b850d2282fe5ecc5a686b213f832c4a7e"
          regression_db="$(mktemp --suffix=.sqlite3)"
          cp "$fixture" "$regression_db"
          XAGUSDT_REGRESSION_DB="$regression_db" cargo test full_xagusdt_grid_regression -- --ignored --nocapture
          after="$(sha256sum "$fixture" | awk '{print $1}')"
          test "$after" = "$before"
          rm -f "$regression_db" "$regression_db-wal" "$regression_db-shm"
