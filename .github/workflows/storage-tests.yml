name: Core trading tests

on:
  push:
    branches: [main]
    paths:
      - "src/storage/**"
      - "src/backtest.rs"
      - "src/backtest/**"
      - "src/trading/**"
      - "migrations/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/storage-tests.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Run Rust tests
        run: cargo test --all-targets
