<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark light" />
    <title>Binance Grid</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <a class="brand" href="/" aria-label="Binance Grid home">
          <span class="brand-mark">BG</span>
          <span>
            <strong>Binance Grid</strong>
            <small>Private quant console</small>
          </span>
        </a>

        <nav class="primary-nav" aria-label="Main navigation">
          <a class="active" href="/" aria-current="page">Console</a>
          <a href="/market.html">Market</a>
          <a href="/data.html">Data Diagnostics</a>
          <a href="/data-downloader.html">Data Downloader</a>
          <a href="/backtests.html">Backtest</a>
        </nav>

        <div class="topbar-actions">
          <span class="environment-pill"><span class="status-dot pending"></span> Setup mode</span>
          <button id="theme-toggle" class="icon-button" type="button" aria-label="Toggle color theme">
            <span aria-hidden="true">◐</span>
          </button>
        </div>
      </header>

      <main>
        <section class="bot-selector" aria-label="Bots">
          <div class="panel-heading">
            <div>
              <p class="eyebrow">Bots</p>
              <h2>Bot strip</h2>
            </div>
            <span id="bot-count" class="badge badge--muted">0 bots</span>
          </div>
          <div id="bot-strip" class="bot-strip"></div>
        </section>

        <section id="console-detail" class="console-detail" aria-live="polite"></section>
      </main>
    </div>

    <script src="/app.js"></script>
  </body>
</html>
